{{ define "main" }}
<div class="max-w-3xl mx-auto px-4 py-12">
  <h1 class="text-4xl font-extrabold text-stone-800 mb-8">{{ .Title }}</h1>
  <div class="divide-y divide-stone-100">
    {{ range .Pages }}
    <article class="py-4">
      <a href="{{ .RelPermalink }}" class="text-xl font-semibold text-stone-700 hover:text-amber-600 transition-colors">
        {{ .Title }}
      </a>
      <p class="text-stone-400 text-sm mt-1">{{ .Summary }}</p>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
