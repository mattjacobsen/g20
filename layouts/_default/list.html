{{ define "main" }}
<div class="list-page">
  <h1 class="list-page__title">{{ .Title }}</h1>
  <div class="list-page__items">
    {{ range .Pages }}
    <article class="list-item">
      <a href="{{ .RelPermalink }}" class="list-item__link">{{ .Title }}</a>
      <p class="list-item__summary">{{ .Summary }}</p>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
