<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />

<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>

<!-- Open Graph (WhatsApp / Facebook link previews) -->
<meta property="og:type"        content="{{ if .IsHome }}website{{ else }}article{{ end }}" />
<meta property="og:title"       content="{{ .Title }}" />
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta property="og:url"         content="{{ .Permalink }}" />
<meta property="og:site_name"   content="{{ .Site.Title }}" />
{{ with .Params.photo }}
<meta property="og:image" content="{{ $.Site.BaseURL }}photos/{{ . }}" />
{{ end }}

<!-- Canonical + hreflang for SEO -->
<link rel="canonical" href="{{ .Permalink }}" />
{{ range .Translations }}
<link rel="alternate" hreflang="{{ .Lang }}" href="{{ .Permalink }}" />
{{ end }}
<link rel="alternate" hreflang="{{ .Lang }}" href="{{ .Permalink }}" />

<!-- Tailwind CSS (CDN — swap for local build in production for perf) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3/dist/tailwind.min.css" />

<!-- Site stylesheet (overrides & custom properties) -->
<link rel="stylesheet" href="/css/site.css" />

<!-- Favicon -->
<link rel="icon" href="/icons/favicon.ico" />
