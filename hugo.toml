baseURL = "https://restaurant-g20.com/"
title   = "Restorant G20"

# Default language (Albanian)
defaultContentLanguage = "sq"
defaultContentLanguageInSubdir = false   # Albanian at root, others at /de/ /en/

enableRobotsTXT = true
summaryLength   = 30

[languages]

  [languages.sq]
    languageName = "Shqip"
    languageCode = "sq"
    weight       = 1
    title        = "Restorant G20"
    contentDir   = "content/sq"

    [languages.sq.params]
      description = "Kuzhinë tradicionale shqiptare."

  [languages.de]
    languageName = "Deutsch"
    languageCode = "de"
    weight       = 2
    title        = "Restaurant G20"
    contentDir   = "content/de"

    [languages.de.params]
      description = "Traditionelle albanische Küche."

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight       = 3
    title        = "Restaurant G20"
    contentDir   = "content/en"

    [languages.en.params]
      description = "Traditional Albanian cuisine."

# ── Global params ─────────────────────────────────────────────────────────────
[params]
  # Contact — edit these when details change
  phone          = "+355 69 662 8215"
  whatsapp       = "355696628215"
  address        = "E851 Sh1, Lezhë 4501, Albania"
  coordinates    = "41.700610, 19.668695"
  googleMapsURL  = "https://maps.app.goo.gl/mnDbAbcEAcyF9onL8"
  appleMapsURL   = "https://maps.apple/p/Ws03Q0gGXTr5V3"
  googleMapsEmbed = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2978.9224235709316!2d19.66612027749456!3d41.7006103712618!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1351df87a4d8fbbf%3A0x4bbcb39beba0a016!2sRestorant%20GRILLED%20Best%20bar%20G-20!5e0!3m2!1sen!2sde!4v1781183940996!5m2!1sen!2sde"

